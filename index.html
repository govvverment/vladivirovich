  body {

    left: -25%;
  }

    box-shadow: 0 26px 54px rgba(0, 0, 0, 0.36);
    border-color: rgba(255, 255, 255, 0.42);
  }

  .button:active {

  .button i {

    flex-shrink: 0;

    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);

  .tap-hint::before {

    background-size: contain;
    transform: scaleX(-1) rotate(-82deg);
    transform-origin: center;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
    animation: hintArrowPulse 1.4s ease-in-out infinite;
  }

  .tap-hint span {
    display: none;
  }

  .info-text {
    font-size: 27px;
    color: #fff;
    text-align: center;
    line-height: 1.55;
  }

  @keyframes hintArrowPulse {
    0%, 100% {
      transform: translateY(0) scaleX(-1) rotate(-82deg) scale(1);
      opacity: 0.9;
    }
    50% {
      transform: translateY(-8px) scaleX(-1) rotate(-82deg) scale(1.05);

  }

  @media (max-width: 768px) {
